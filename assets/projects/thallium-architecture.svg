<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 90" width="100%" height="90" fill="none">
  <defs>
    <style>
      .node-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 11px; fill: #F5F1E8; letter-spacing: 0.5px; }
      .node-sub { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #8E929E; }
      .core-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 11px; fill: #D8B46A; letter-spacing: 0.5px; }
      .core-sub { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #D8B46A; opacity: 0.85; }
      .flow-line { stroke: #262933; stroke-width: 1; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="800" height="90" rx="6" fill="#0D0E12" />
  <rect x="0.5" y="0.5" width="799" height="89" rx="5.5" fill="none" stroke="#1D2027" stroke-width="1" />

  <!-- Connecting Backbone Line -->
  <line x1="60" y1="45" x2="740" y2="45" class="flow-line" />

  <!-- Node 1: Client -->
  <g transform="translate(60, 24)">
    <rect width="135" height="42" rx="4" fill="#12141A" stroke="#22252C" stroke-width="1" />
    <text x="14" y="19" class="node-title">CLIENT RUNTIME</text>
    <text x="14" y="32" class="node-sub">Next.js 16 &#183; React 19</text>
  </g>

  <!-- Node 2: Security -->
  <g transform="translate(245, 24)">
    <rect width="135" height="42" rx="4" fill="#12141A" stroke="#22252C" stroke-width="1" />
    <text x="14" y="19" class="node-title">AUTH &amp; RLS GATE</text>
    <text x="14" y="32" class="node-sub">Supabase Session</text>
  </g>

  <!-- Node 3: RPC Core (Accent) -->
  <g transform="translate(430, 24)">
    <rect width="145" height="42" rx="4" fill="#161820" stroke="#D8B46A" stroke-width="1" />
    <text x="14" y="19" class="core-title">ATOMIC RPC ENGINE</text>
    <text x="14" y="32" class="core-sub">PostgreSQL (S &#8805; 0)</text>
  </g>

  <!-- Node 4: Ledger -->
  <g transform="translate(625, 24)">
    <rect width="125" height="42" rx="4" fill="#12141A" stroke="#22252C" stroke-width="1" />
    <text x="14" y="19" class="node-title">IMMUTABLE LEDGER</text>
    <text x="14" y="32" class="node-sub">Double-Entry Audit</text>
  </g>
</svg>
