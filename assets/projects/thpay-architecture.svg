<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 90" width="100%" height="90" fill="none">
  <defs>
    <style>
      .node-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 11px; fill: #F5F1E8; letter-spacing: 0.5px; }
      .node-sub { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #8E929E; }
      .core-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 11px; fill: #D8B46A; letter-spacing: 0.5px; }
      .core-sub { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #D8B46A; opacity: 0.85; }
      .flow-line { stroke: #262933; stroke-width: 1; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="800" height="90" rx="6" fill="#0D0E12" />
  <rect x="0.5" y="0.5" width="799" height="89" rx="5.5" fill="none" stroke="#1D2027" stroke-width="1" />

  <!-- Connecting Backbone Line -->
  <line x1="55" y1="45" x2="745" y2="45" class="flow-line" />

  <!-- Node 1: Edge Simulator -->
  <g transform="translate(55, 24)">
    <rect width="135" height="42" rx="4" fill="#12141A" stroke="#22252C" stroke-width="1" />
    <text x="14" y="19" class="node-title">EDGE SIMULATOR</text>
    <text x="14" y="32" class="node-sub">Rust (Wasm) Runtime</text>
  </g>

  <!-- Node 2: Fiscal Core Engine (Accent) -->
  <g transform="translate(230, 24)">
    <rect width="165" height="42" rx="4" fill="#161820" stroke="#D8B46A" stroke-width="1" />
    <text x="14" y="19" class="core-title">DETERMINISTIC FISCAL</text>
    <text x="14" y="32" class="core-sub">Java 21 Loom &#183; XMLDSig</text>
  </g>

  <!-- Node 3: Analytics -->
  <g transform="translate(435, 24)">
    <rect width="145" height="42" rx="4" fill="#12141A" stroke="#22252C" stroke-width="1" />
    <text x="14" y="19" class="node-title">ANALYTICS &amp; EQUITY</text>
    <text x="14" y="32" class="node-sub">Python 3.12 &#183; Polars</text>
  </g>

  <!-- Node 4: Persistence -->
  <g transform="translate(620, 24)">
    <rect width="135" height="42" rx="4" fill="#12141A" stroke="#22252C" stroke-width="1" />
    <text x="14" y="19" class="node-title">BITEMPORAL LEDGER</text>
    <text x="14" y="32" class="node-sub">PostgreSQL 16 Append-Only</text>
  </g>
</svg>
