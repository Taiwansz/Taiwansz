<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%" height="120" fill="none">
  <defs>
    <style>
      .mono-tag {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        letter-spacing: 2px;
        fill: #D8B46A;
        font-weight: 600;
      }
      .display-name {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 22px;
        font-weight: 700;
        fill: #F5F1E8;
        letter-spacing: 0.5px;
      }
      .sub-role {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 12px;
        fill: #8E929E;
        letter-spacing: 0.2px;
      }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="800" height="120" rx="6" fill="#0D0E12" />
  <rect x="0.5" y="0.5" width="799" height="119" rx="5.5" fill="none" stroke="#1D2027" stroke-width="1" />

  <!-- Accent Vertical Hairline -->
  <rect x="36" y="28" width="2" height="64" rx="1" fill="#D8B46A" />

  <!-- Typography -->
  <text x="52" y="45" class="mono-tag">TAIWANSZ // ENGENHARIA DE SOFTWARE &amp; IA</text>
  <text x="52" y="72" class="display-name">MATHEUS SOUSA DOS SANTOS</text>
  <text x="52" y="93" class="sub-role">Sistemas Inteligentes &#183; Agentes Autônomos &#183; Arquitetura Transacional</text>

  <!-- Minimal Precision Mark (Right) -->
  <g transform="translate(730, 60)">
    <rect x="-12" y="-12" width="24" height="24" rx="3" fill="none" stroke="#262933" stroke-width="1" transform="rotate(45)" />
    <circle cx="0" cy="0" r="2.5" fill="#D8B46A" />
  </g>
</svg>
