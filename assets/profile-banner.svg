<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 85" width="100%" height="85" fill="none">
  <defs>
    <style>
      .name {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 21px;
        font-weight: 700;
        fill: #F5F1E8;
        letter-spacing: 0.5px;
      }
      .role {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        fill: #8E929E;
        letter-spacing: 0.2px;
      }
      .role-highlight {
        fill: #D8B46A;
        font-weight: 600;
      }
      .tag {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        fill: #D8B46A;
        letter-spacing: 1.5px;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="85" rx="6" fill="#0D0E12" />
  <rect x="0.5" y="0.5" width="799" height="84" rx="5.5" stroke="#1D2027" stroke-width="1" />

  <!-- Typography -->
  <text x="36" y="39" class="name">MATHEUS SOUSA DOS SANTOS</text>
  <text x="36" y="62" class="role"><tspan class="role-highlight">Engenharia de Software &amp; IA</tspan> &#183; Sistemas Distribuídos e Agentes Autônomos</text>

  <!-- Handle -->
  <text x="764" y="47" text-anchor="end" class="tag">TAIWANSZ</text>
</svg>
